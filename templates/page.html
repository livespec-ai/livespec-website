<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$page-title$</title>
    <meta name="description" content="$page-description$">
$if(article)$
    <meta name="author" content="Chad Woolley">
$endif$
    <link rel="canonical" href="$canonical-url$">
    <meta property="og:title" content="$page-title$">
    <meta property="og:description" content="$page-description$">
    <meta property="og:url" content="$canonical-url$">
$if(article)$
    <meta property="og:type" content="article">
    <meta property="article:published_time" content="$published$">
    <meta property="article:author" content="https://thewoolleyweb.com/">
$else$
    <meta property="og:type" content="website">
$endif$
    <link rel="stylesheet" href="$css-href$">
    <script data-goatcounter="https://livespec-ai.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <noscript><img src="https://livespec-ai.goatcounter.com/count?p=$url-path$" alt="" width="1" height="1"></noscript>
    <div id="container">
      <div id="header">
        <h1><a href="$home-href$">livespec</a></h1>
      </div>
      <div id="content">
$if(article)$
        <article class="article">
          <header>
            <h1>$page-heading$</h1>
            <p class="byline">By <a href="https://thewoolleyweb.com/" rel="author">Chad Woolley</a> · <time datetime="$published$">$published-display$</time></p>
          </header>
          <div class="body">
            $body$
          </div>
          <footer>
            <p><a href="$blog-href$">All blog entries</a> · <a href="$home-href$">Home</a></p>
          </footer>
        </article>
$else$
        $body$
$endif$
      </div>
      <div id="footer">
        <a href="$home-href$">Home</a>
        <a href="$blog-href$">Blog</a>
        <a href="https://github.com/thewoolleyman/livespec">livespec on GitHub</a>
        <a href="https://thewoolleyweb.com/">thewoolleyweb.com</a>
      </div>
    </div>
  </body>
</html>
